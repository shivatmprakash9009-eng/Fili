name: Fili CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel stale runs for the same branch/PR; never cancel a different branch's checks.
concurrency:
  group: fili-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny permissions. Jobs only receive read access to repository contents.
permissions:
  contents: read

jobs:
  backend:
    name: Backend • Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r api-requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q agents core utils tests main.py dashboard.py api_v1.py

      - name: Run backend unit and integration tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend • Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
